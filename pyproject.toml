[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "chip-rl"
version = "0.27.0"
description = "Constrained RTL pilot with private paired HDL evaluation"
requires-python = ">=3.10"
[tool.setuptools]
packages = ["chip_rl", "chip_rl.cycle", "chip_rl.expansion", "chip_rl.qualification", "chip_rl.history", "chip_rl.cdc", "chip_rl.memory", "chip_rl.quality", "chip_rl.layout", "chip_rl.softmax", "chip_rl.requant"]
[tool.setuptools.package-data]
chip_rl = ["contracts.md"]
"chip_rl.cycle" = ["contracts.md"]
"chip_rl.expansion" = ["contracts.md"]
"chip_rl.quality" = ["contracts.md"]
"chip_rl.layout" = ["contracts.md", "engine.sv"]
"chip_rl.softmax" = ["contracts.md"]

"chip_rl.requant" = ["contracts.md"]
