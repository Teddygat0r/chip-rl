[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "chip-rl"
version = "0.11.0"
description = "Constrained RTL pilot with private paired HDL evaluation"
requires-python = ">=3.10"
[tool.setuptools]
packages = ["chip_rl", "chip_rl.cycle", "chip_rl.expansion", "chip_rl.qualification", "chip_rl.history", "chip_rl.cdc"]
[tool.setuptools.package-data]
chip_rl = ["contracts.md"]
"chip_rl.cycle" = ["contracts.md"]
"chip_rl.expansion" = ["contracts.md"]
